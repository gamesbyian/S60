name: Episode 1 logo-shaped repair prototype

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/episode-01-logo-shaped-prototype.yml"

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FTP_HOST: wood.seedhost.eu
      FTP_USER: ianseeds
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet numpy opencv-python-headless

      - name: Download episode 1 pair
        shell: bash
        run: |
          python3 - <<'PY'
          import ftplib, os
          files={
            "dvd.avi":"/downloads/S60/DVD/Studio 60 - 01 - Pilot.avi",
            "hd.mp4":"/downloads/S60/1080p/Studio 60 S01E01.mp4",
          }
          ftp=ftplib.FTP()
          ftp.connect(os.environ["FTP_HOST"],21,timeout=30)
          ftp.login(os.environ["FTP_USER"],os.environ["FTP_PASSWORD"])
          ftp.voidcmd("TYPE I")
          for local,remote in files.items():
              with open(local,"wb") as fh:
                  ftp.retrbinary("RETR "+remote, fh.write, blocksize=1024*1024)
          ftp.quit()
          PY

      - name: Extract matched RGB frames
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          pairs=[
              (300,301.93),
              (900,899.56),
              (1500,1499.40),
              (1800,1801.17),
              (2200,2200.59),
              (2500,2500.59),
          ]
          for hd,dvd in pairs:
              tag=f"{hd:04d}"
              subprocess.run(["ffmpeg","-v","error","-ss",str(dvd),"-i","dvd.avi","-frames:v","1",f"dvd-{tag}.png"],check=True)
              subprocess.run(["ffmpeg","-v","error","-ss",str(hd),"-i","hd.mp4","-frames:v","1",f"hd-{tag}.png"],check=True)
          PY

      - name: Build calibrated logo mask and repair samples
        shell: bash
        run: |
          python3 - <<'PY'
          import cv2, json, math, os, numpy as np

          tags=["0300","0900","1500","1800","2200","2500"]
          x0,y0,x1,y1 = 170,890,384,982
          os.makedirs("prototype",exist_ok=True)

          def register(dvd,hd):
              gray_d=cv2.cvtColor(dvd,cv2.COLOR_BGR2GRAY)
              gray_h=cv2.cvtColor(hd,cv2.COLOR_BGR2GRAY)
              pts=cv2.goodFeaturesToTrack(gray_d,maxCorners=1800,qualityLevel=0.01,minDistance=7,blockSize=5)
              if pts is None: return None,None
              nxt,status,err=cv2.calcOpticalFlowPyrLK(gray_d,gray_h,pts,None,winSize=(31,31),maxLevel=4)
              good=status.reshape(-1)==1
              src=pts.reshape(-1,2)[good]; dst=nxt.reshape(-1,2)[good]
              keep=~((dst[:,0]>=x0)&(dst[:,0]<x1)&(dst[:,1]>=y0)&(dst[:,1]<y1))
              src=src[keep]; dst=dst[keep]
              M,inliers=cv2.estimateAffinePartial2D(src,dst,method=cv2.RANSAC,ransacReprojThreshold=2.0,maxIters=5000,confidence=0.999,refineIters=50)
              if M is None: return None,None
              a,b,tx=M[0]; cc,d,ty=M[1]
              scale=(math.hypot(a,cc)+math.hypot(b,d))/2
              rot=math.degrees(math.atan2(cc,a))
              n=int(inliers.sum()) if inliers is not None else 0
              ok=(0.94<=scale<=1.06 and abs(rot)<=2.0 and abs(tx)<=80 and abs(ty)<=80 and n>=50)
              return M,{"ok":ok,"scale":scale,"rotation_deg":rot,"tx":float(tx),"ty":float(ty),"inliers":n}

          registered={}; meta={}
          for tag in tags:
              dvd_full=cv2.imread(f"dvd-{tag}.png",cv2.IMREAD_COLOR)
              hd_full=cv2.imread(f"hd-{tag}.png",cv2.IMREAD_COLOR)
              dvd=dvd_full[6:470,0:848]
              hd=hd_full[4:1076,10:1914]
              up=cv2.resize(dvd,(hd.shape[1],hd.shape[0]),interpolation=cv2.INTER_LANCZOS4)
              M,m=register(up,hd); meta[tag]=m
              if M is None or not m["ok"]: continue
              donor=cv2.warpAffine(up,M,(hd.shape[1],hd.shape[0]),flags=cv2.INTER_LANCZOS4)
              registered[tag]=(donor,hd,hd_full)

          if "2200" not in registered:
              raise RuntimeError("2200 calibration frame did not pass registration")

          # Calibrate the logo silhouette from the dark 2200 s frame. Here the
          # clean donor is nearly black under the bug, so HD-vs-donor contrast
          # isolates the overlay far more reliably than cross-scene persistence.
          donor,hd,_=registered["2200"]
          dg=cv2.cvtColor(donor,cv2.COLOR_BGR2GRAY).astype(np.int16)
          hg=cv2.cvtColor(hd,cv2.COLOR_BGR2GRAY).astype(np.int16)
          roi=np.abs(hg-dg)[y0:y1,x0:x1].astype(np.uint8)

          # Retain strongly altered pixels, connect the peacock/text strokes,
          # and remove tiny unrelated components.
          seed=(roi>=18).astype(np.uint8)*255
          seed=cv2.morphologyEx(seed,cv2.MORPH_OPEN,np.ones((2,2),np.uint8))
          seed=cv2.morphologyEx(seed,cv2.MORPH_CLOSE,np.ones((5,5),np.uint8))

          n,labels,stats,cent=cv2.connectedComponentsWithStats(seed,8)
          kept=np.zeros_like(seed)
          components=[]
          for i in range(1,n):
              sx,sy,sw,sh,area=[int(v) for v in stats[i]]
              if area>=25:
                  kept[labels==i]=255
                  components.append({"x":sx+x0,"y":sy+y0,"w":sw,"h":sh,"area":area})

          # The overlay is expected to occupy a horizontally compact cluster.
          # Keep components whose union sits inside the known conservative ROI,
          # then bridge small gaps between peacock and .com.
          kept=cv2.morphologyEx(kept,cv2.MORPH_CLOSE,np.ones((9,5),np.uint8))
          kept=cv2.dilate(kept,np.ones((3,3),np.uint8),iterations=1)

          full_binary=np.zeros((1072,1904),dtype=np.uint8)
          full_binary[y0:y1,x0:x1]=kept

          # Soft edge only. Interior remains essentially full donor replacement.
          alpha=cv2.GaussianBlur(full_binary,(0,0),sigmaX=1.1,sigmaY=1.1).astype(np.float32)/255.0
          alpha=np.clip(alpha,0,1)

          changed=int(np.count_nonzero(alpha>0.01))
          strong=int(np.count_nonzero(alpha>0.5))

          # Sanity gate: mask must be logo-sized, not a tiny fragment or the
          # whole conservative ROI.
          if not (2500 <= changed <= 18000 and 1200 <= strong <= 12000):
              raise RuntimeError(f"mask sanity gate failed: changed={changed}, strong={strong}")

          # Report bounding box of actual mask.
          ys,xs=np.where(full_binary>0)
          mask_bbox=[int(xs.min()),int(ys.min()),int(xs.max()+1),int(ys.max()+1)]

          outputs=[]
          for tag,(donor,hd,hd_full) in registered.items():
              # No global photometric remapping. Preserve donor values as-is;
              # only a tiny shaped region is used, avoiding the tonal-slab
              # failure seen in the rectangular prototype.
              hd_f=hd.astype(np.float32)
              donor_f=donor.astype(np.float32)
              a3=alpha[:,:,None]
              restored=np.clip(hd_f*(1-a3)+donor_f*a3,0,255).astype(np.uint8)

              # Boundary metric around shaped mask.
              boundary=(cv2.dilate(full_binary,np.ones((7,7),np.uint8),1)>0) & (cv2.erode(full_binary,np.ones((7,7),np.uint8),1)==0)
              def grad_mean(img):
                  g=cv2.cvtColor(img,cv2.COLOR_BGR2GRAY).astype(np.float32)
                  gx=cv2.Sobel(g,cv2.CV_32F,1,0,ksize=3)
                  gy=cv2.Sobel(g,cv2.CV_32F,0,1,ksize=3)
                  mag=cv2.magnitude(gx,gy)
                  return float(np.mean(mag[boundary])),float(np.median(mag[boundary]))
              gm0=grad_mean(hd); gm1=grad_mean(restored)

              restored_full=hd_full.copy(); restored_full[4:1076,10:1914]=restored
              donor_full=hd_full.copy(); donor_full[4:1076,10:1914]=donor

              fx0,fy0,fx1,fy1=180,894,394,986
              pad=45
              X0=max(0,fx0-pad); Y0=max(0,fy0-pad); X1=min(1920,fx1+pad); Y1=min(1080,fy1+pad)
              crop_o=hd_full[Y0:Y1,X0:X1]
              crop_d=donor_full[Y0:Y1,X0:X1]
              crop_r=restored_full[Y0:Y1,X0:X1]
              mask_vis=np.zeros_like(crop_o)
              am=(alpha[Y0-4:Y1-4,X0-10:X1-10]*255).astype(np.uint8)
              if am.shape[:2]==mask_vis.shape[:2]:
                  mask_vis[:]=am[:,:,None]
              contact=np.hstack([crop_o,crop_d,crop_r,mask_vis])
              cv2.imwrite(f"prototype/{tag}-logo-shaped-comparison.png",contact)

              # How much logo signal remains inside the calibrated mask,
              # measured as HD/restored disagreement from clean donor.
              mask_core=alpha>0.5
              before=np.abs(cv2.cvtColor(hd,cv2.COLOR_BGR2GRAY).astype(np.float32)-cv2.cvtColor(donor,cv2.COLOR_BGR2GRAY).astype(np.float32))
              after=np.abs(cv2.cvtColor(restored,cv2.COLOR_BGR2GRAY).astype(np.float32)-cv2.cvtColor(donor,cv2.COLOR_BGR2GRAY).astype(np.float32))
              outputs.append({
                  "tag":tag,
                  "registration":meta[tag],
                  "masked_absdiff_to_donor_mean_before":float(np.mean(before[mask_core])),
                  "masked_absdiff_to_donor_mean_after":float(np.mean(after[mask_core])),
                  "boundary_gradient_mean_original":gm0[0],
                  "boundary_gradient_mean_restored":gm1[0],
                  "boundary_gradient_median_original":gm0[1],
                  "boundary_gradient_median_restored":gm1[1],
              })

          cv2.imwrite("prototype/logo-alpha.png",(alpha*255).astype(np.uint8))
          print("=== CALIBRATED LOGO MASK PROTOTYPE JSON ===")
          print(json.dumps({
              "calibration_tag":"2200",
              "valid_registration_tags":sorted(registered.keys()),
              "rejected_registration_tags":[t for t in tags if t not in registered],
              "components":components,
              "mask_bbox_active_picture":mask_bbox,
              "mask_pixels_alpha_gt_001":changed,
              "mask_pixels_alpha_gt_05":strong,
              "frame_pixels":1920*1080,
              "fraction_frame_alpha_gt_001":changed/(1920*1080),
              "fraction_frame_alpha_gt_05":strong/(1920*1080),
              "comparison_columns":["original_1080p","registered_DVD_donor","logo_shaped_restoration","alpha_mask"],
              "results":outputs,
          },indent=2))
          PY

      - name: Upload logo-shaped comparisons
        uses: actions/upload-artifact@v4
        with:
          name: episode-01-logo-shaped-prototype
          path: prototype/*.png
          if-no-files-found: error
