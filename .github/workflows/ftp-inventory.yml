name: FTP inventory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ftp-inventory.yml"
  push:
    paths:
      - ".github/workflows/ftp-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: wood.seedhost.eu
      FTP_USER: ianseeds
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: Discover FTP layout
        shell: bash
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          import sys
          from collections import deque

          host = os.environ["FTP_HOST"]
          user = os.environ["FTP_USER"]
          password = os.environ.get("FTP_PASSWORD", "")

          if not password:
              print("ERROR: FTP_PASSWORD secret is not available.", file=sys.stderr)
              sys.exit(2)

          ftp = ftplib.FTP()
          ftp.connect(host, 21, timeout=30)
          ftp.login(user, password)

          print(f"Connected to {host}")
          print(f"Login directory: {ftp.pwd()}")
          print("")

          def entries_here():
              try:
                  entries = list(ftp.mlsd())
                  entries.sort(key=lambda item: item[0].lower())
                  return [(name, facts) for name, facts in entries if name not in (".", "..")]
              except Exception:
                  names = sorted(ftp.nlst(), key=str.lower)
                  return [(name, {"type": "?"}) for name in names]

          def print_entries(label, entries):
              print(f"== {label} ({ftp.pwd()}) ==")
              for name, facts in entries:
                  kind = facts.get("type", "?")
                  raw_size = facts.get("size")
                  size = int(raw_size) if raw_size and str(raw_size).isdigit() else None
                  size_text = f"{size:,} bytes" if size is not None else "-"
                  print(f"{kind:8} {size_text:>18}  {name}")
              print("")

          ftp.cwd("/")
          root_entries = entries_here()
          print_entries("FTP root", root_entries)

          # We now know /downloads exists. Inventory it directly, then search
          # a bounded subtree for anything named like S60. This is read-only.
          try:
              ftp.cwd("/downloads")
          except Exception as exc:
              print(f"ERROR: /downloads exists in the root listing but CWD failed: {type(exc).__name__}: {exc}", file=sys.stderr)
              sys.exit(3)

          downloads_entries = entries_here()
          print_entries("/downloads", downloads_entries)

          matches = []
          queue = deque()
          for name, facts in downloads_entries:
              if facts.get("type") == "dir":
                  queue.append((f"/downloads/{name}", 1))

          max_depth = 3
          max_dirs = 250
          visited = 0

          while queue and visited < max_dirs:
              path, depth = queue.popleft()
              visited += 1
              try:
                  ftp.cwd(path)
                  entries = entries_here()
              except Exception as exc:
                  print(f"Could not inspect {path}: {type(exc).__name__}: {exc}")
                  continue

              base = path.rsplit("/", 1)[-1].lower()
              if "s60" in base:
                  matches.append(path)
                  print_entries(f"S60-like directory: {path}", entries)

              if depth < max_depth:
                  for name, facts in entries:
                      if facts.get("type") != "dir":
                          continue
                      child = f"{path}/{name}"
                      if "s60" in name.lower():
                          matches.append(child)
                          try:
                              ftp.cwd(child)
                              print_entries(f"S60-like directory: {child}", entries_here())
                          except Exception as exc:
                              print(f"Could not inspect match {child}: {type(exc).__name__}: {exc}")
                      queue.append((child, depth + 1))

          # De-duplicate while preserving order.
          matches = list(dict.fromkeys(matches))
          print(f"Scanned {visited} directories beneath /downloads (max depth {max_depth}).")
          if matches:
              print("S60-like paths found:")
              for path in matches:
                  print(f"  {path}")
          else:
              print("No directory containing 's60' found within the bounded search.")

          try:
              ftp.quit()
          except Exception:
              ftp.close()
          PY

# PR probe trigger
