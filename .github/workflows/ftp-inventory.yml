name: FTP inventory

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ftp-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: wood.seedhost.eu
      FTP_USER: ianseeds
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: Discover FTP layout
        shell: bash
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          import sys

          host = os.environ["FTP_HOST"]
          user = os.environ["FTP_USER"]
          password = os.environ.get("FTP_PASSWORD", "")

          if not password:
              print("ERROR: FTP_PASSWORD secret is not available.", file=sys.stderr)
              sys.exit(2)

          ftp = ftplib.FTP()
          ftp.connect(host, 21, timeout=30)
          ftp.login(user, password)

          print(f"Connected to {host}")
          print(f"Login directory: {ftp.pwd()}")
          print("")

          def list_here(label):
              print(f"== {label} ({ftp.pwd()}) ==")
              try:
                  entries = list(ftp.mlsd())
                  entries.sort(key=lambda item: item[0].lower())
                  for name, facts in entries:
                      if name in (".", ".."):
                          continue
                      kind = facts.get("type", "?")
                      raw_size = facts.get("size")
                      size = int(raw_size) if raw_size and raw_size.isdigit() else None
                      size_text = f"{size:,} bytes" if size is not None else "-"
                      print(f"{kind:8} {size_text:>18}  {name}")
                  return [name for name, _ in entries if name not in (".", "..")]
              except Exception as exc:
                  print(f"MLSD unavailable: {type(exc).__name__}: {exc}")
                  names = sorted(ftp.nlst(), key=str.lower)
                  for name in names:
                      print(name)
                  return names
              finally:
                  print("")

          ftp.cwd("/")
          root_names = list_here("FTP root")

          candidates = []
          for name in root_names:
              lname = name.lower()
              if any(token in lname for token in ("download", "home", "files", "data", "media", "storage", user.lower())):
                  candidates.append(name)

          print("Candidate directories to inspect:", ", ".join(candidates) if candidates else "(none found by name)")
          print("")

          for name in candidates[:12]:
              try:
                  ftp.cwd("/")
                  ftp.cwd(name)
                  list_here(f"child: /{name}")
              except Exception as exc:
                  print(f"Could not inspect /{name}: {type(exc).__name__}: {exc}")
                  print("")

          # Also try the original expected locations so the log makes the mismatch explicit.
          for path in ("/downloads", "/downloads/s60", "downloads", "downloads/s60"):
              try:
                  ftp.cwd("/")
                  ftp.cwd(path)
                  print(f"FOUND expected-style path: {path} -> {ftp.pwd()}")
                  list_here(f"expected-style path: {path}")
              except Exception as exc:
                  print(f"Not found: {path}: {type(exc).__name__}: {exc}")

          try:
              ftp.quit()
          except Exception:
              ftp.close()
          PY
