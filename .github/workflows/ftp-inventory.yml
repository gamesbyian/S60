name: FTP inventory

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ftp-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: wood.seedhost.eu
      FTP_USER: ianseeds
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: Check FTP directory and list files
        shell: bash
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          import sys

          host = os.environ["FTP_HOST"]
          user = os.environ["FTP_USER"]
          password = os.environ.get("FTP_PASSWORD", "")

          if not password:
              print("ERROR: FTP_PASSWORD secret is not available.", file=sys.stderr)
              sys.exit(2)

          ftp = ftplib.FTP()
          ftp.connect(host, 21, timeout=30)
          ftp.login(user, password)

          print(f"Connected to {host}")
          print(f"Login directory: {ftp.pwd()}")

          candidates = ["/downloads/s60", "downloads/s60"]
          selected = None
          errors = []

          for path in candidates:
              try:
                  # Return to the login directory before each attempt.
                  ftp.cwd("/")
                  try:
                      ftp.cwd(path)
                  except ftplib.error_perm:
                      # Some hosted FTP accounts expose the login directory as a
                      # virtual root, so retry relative to the original login cwd.
                      login_dir = ftp.pwd()
                      raise
                  selected = ftp.pwd()
                  break
              except Exception as exc:
                  errors.append(f"{path}: {type(exc).__name__}: {exc}")

          if selected is None:
              # Last attempt: reconnect and try relative to the actual login cwd.
              try:
                  ftp.quit()
              except Exception:
                  pass
              ftp = ftplib.FTP()
              ftp.connect(host, 21, timeout=30)
              ftp.login(user, password)
              login_dir = ftp.pwd()
              try:
                  ftp.cwd("downloads/s60")
                  selected = ftp.pwd()
              except Exception as exc:
                  errors.append(f"relative from {login_dir}: {type(exc).__name__}: {exc}")

          if selected is None:
              print("ERROR: Could not enter the expected S60 directory.", file=sys.stderr)
              for error in errors:
                  print(f"  {error}", file=sys.stderr)
              sys.exit(3)

          print(f"S60 directory: {selected}")
          print("")
          print("Inventory:")

          total_size = 0
          count = 0

          try:
              entries = list(ftp.mlsd())
              entries.sort(key=lambda item: item[0].lower())
              for name, facts in entries:
                  if name in (".", ".."):
                      continue
                  kind = facts.get("type", "?")
                  raw_size = facts.get("size")
                  size = int(raw_size) if raw_size and raw_size.isdigit() else None
                  if size is not None:
                      total_size += size
                  count += 1
                  size_text = f"{size:,} bytes" if size is not None else "-"
                  print(f"{kind:8} {size_text:>18}  {name}")
          except (ftplib.error_perm, AttributeError):
              names = sorted(ftp.nlst(), key=str.lower)
              for name in names:
                  count += 1
                  try:
                      size = ftp.size(name)
                  except Exception:
                      size = None
                  if size is not None:
                      total_size += size
                  size_text = f"{size:,} bytes" if size is not None else "-"
                  print(f"{'?':8} {size_text:>18}  {name}")

          print("")
          print(f"Entries: {count}")
          print(f"Known total size: {total_size:,} bytes ({total_size / (1024**3):.2f} GiB)")

          try:
              ftp.quit()
          except Exception:
              ftp.close()
          PY
